<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1250" viewBox="0 0 1280 1250"><defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#e8f4fa}.small{font-size:18px;fill:#adc6d5}.name{font-size:30px;font-weight:700}.label{font-size:22px}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67e2fa"/></marker></defs><rect width="1280" height="1250" fill="#081724"/><text x="70" y="58" font-size="32" font-weight="700">回声号｜舰桥结构与固定人员位置</text><text x="70" y="92" class="small">俯视示意 · 座位拓扑母版 · 2026-11-01 · 非工程尺寸图</text><path d="M80 1040V280Q80 140 240 140H1040Q1200 140 1200 280V1040Z" fill="#102a3b" stroke="#608297" stroke-width="3"/><path d="M230 155H1050" stroke="#6de4fa" stroke-width="12"/><text x="640" y="130" text-anchor="middle" class="label">船首／前方 · 舷窗与前壁</text><text x="85" y="330" class="label">左舷</text><text x="1120" y="330" class="label">右舷</text><path d="M640 980V925" stroke="#67e2fa" stroke-width="3" marker-end="url(#arrow)"/><text x="640" y="1018" text-anchor="middle" class="label">摄影机：后方中央 → 朝船首拍摄</text><text x="640" y="1080" text-anchor="middle" class="label">船尾／后方 · 靠近母版镜头</text><rect x="505" y="515" width="270" height="320" rx="15" fill="#0a1d2b" stroke="#e6a263" stroke-width="2" stroke-dasharray="10 7"/><text x="640" y="575" text-anchor="middle" class="label">中央通道</text><text x="640" y="620" text-anchor="middle" class="label">回收舱升降口</text><text x="640" y="657" text-anchor="middle" class="small">正常工作：地板闭合</text><text x="640" y="693" text-anchor="middle" class="small">升舱：地板开启</text><text x="640" y="744" text-anchor="middle" class="small">正下方为同一采样舱</text><text x="640" y="778" text-anchor="middle" class="small">机械臂＋三角回收舱</text><g transform="translate(460,205)"><rect width="360" height="210" rx="16" fill="#183c50" stroke="#7ce6ff" stroke-width="2"/><rect x="20" y="15" width="320" height="27" rx="5" fill="#073247" stroke="#6ae5ff"/><text x="180" y="35" text-